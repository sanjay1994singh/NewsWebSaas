<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create InfoSaas Account</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #13201b; background: #f7faf8; }
    main { width: min(780px, calc(100% - 32px)); margin: 40px auto; background: #fff; border: 1px solid #d8e1dc; border-radius: 8px; padding: 24px; }
    label { display: block; font-weight: 700; margin: 14px 0 6px; }
    input, select { width: 100%; padding: 11px; border: 1px solid #bccbc4; border-radius: 6px; }
    .btn { margin-top: 18px; border: 0; border-radius: 6px; background: #16614f; color: #fff; padding: 12px 18px; font-weight: 700; cursor: pointer; }
    .errorlist { color: #a12a1b; }
  </style>
</head>
<body>
  <main>
    <h1>Create Account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Continue To Subscription</button>
    </form>
  </main>
</body>
</html>
